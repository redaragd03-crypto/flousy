name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (www/)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Setup Android SDK (manual - setup-android action is broken on legacy tools package)"
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate CI release keystore (CI-only throwaway signing)
        run: |
          keytool -genkeypair -keystore android/release-ci.keystore \
            -alias flousy-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "flousy-ci-store" -keypass "flousy-ci-key" \
            -dname "CN=FLOUSY CI, OU=Dev, O=FLOUSY, L=Cairo, ST=EG, C=EG"

      - name: Build APKs (debug + release)
        working-directory: android
        env:
          CI_RELEASE_KEYSTORE: ${{ github.workspace }}/android/release-ci.keystore
          CI_STORE_PASS: "flousy-ci-store"
          CI_KEY_ALIAS: flousy-ci
          CI_KEY_PASS: "flousy-ci-key"
        run: |
          unset ANDROID_SDK_ROOT
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify APKs
        working-directory: android
        run: |
          set -e
          ls -la app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          AAPT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          echo "=== debug badging ==="
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:|^application-label:|^application-icon:"
          echo "=== release badging ==="
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package:|^application-label:|^application-icon:"
          echo "=== launcher icons inside APK ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "mipmap-xxxhdpi|AndroidManifest" | head -20

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flousy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flousy-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
